  { key: 'k5', tex: '\\newcommand{\\R}{\\mathbb{R}}\\forall x \\in \\R, \\; x^2 \\ge 0', size: 18 },
];
function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
function start() {
  let i = 0;
  (function next() {
    if (i >= CASES.length) { done(); return; }
    const c = CASES[i]; i++;
    const before = received.length;
    f.contentWindow.tex2png(c.key, b64utf8(c.tex), 0, c.size);
    const t0 = Date.now();
    const timer = setInterval(function () {
      if (received.length > before) {
        clearInterval(timer);
        const msg = JSON.parse(received[received.length - 1]);
        results.push({ key: c.key, ok: msg.ok, w: msg.w, h: msg.h, err: msg.err || '', len: (msg.png || '').length });
        if (msg.ok) {
          const img = document.createElement('img');
          img.src = msg.png;
          img.style.height = Math.min(60, msg.h) + 'px';
          document.getElementById('shots').appendChild(img);
        }
        setTimeout(next, 50);
      } else if (Date.now() - t0 > 12000) {
        clearInterval(timer);
        results.push({ key: c.key, ok: false, err: 'timeout waiting postPng' });
        next();
      }
    }, 60);
  })();
}
function failAll(err) {
  const res = document.createElement('div');
  res.id = 'mjf-result';
  res.setAttribute('data-json', JSON.stringify([{ ok: false, err: err }]));
  document.body.appendChild(res);
}
function done() {
  const res = document.createElement('div');
  res.id = 'mjf-result';
  res.setAttribute('data-json', JSON.stringify(results));
  document.body.appendChild(res);
  document.title = 'DONE ' + results.filter(function (r) { return r.ok; }).length + '/' + results.length;
}
</script>
