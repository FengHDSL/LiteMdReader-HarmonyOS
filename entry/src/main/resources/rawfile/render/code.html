<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.05,maximum-scale=10,user-scalable=yes">
<title>代码</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  body{color:#1B1F27;-webkit-text-size-adjust:100%;}
  body.dark{color:#ECEFF4;}
  #app{padding:10px 12px;box-sizing:border-box;}
  table{border-collapse:collapse;width:100%;
        font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"HarmonyOS Sans SC",monospace;}
  td.ln{width:1%;padding:0 10px 0 0;text-align:right;color:rgba(128,128,128,0.85);
        user-select:none;vertical-align:top;white-space:nowrap;}
  td.lc{padding:0;white-space:pre-wrap;word-break:break-word;vertical-align:top;width:100%;}
  /* 指定行高亮（围栏元数据 js{1,3-5}）：整行铺琥珀底，与正文卡片同一支颜色。
     lc 拉满表宽，短行的色带才不会比长行短一截（浮层里"亮度不一样"的观感来自带宽）。 */
  tr.hl td{background:rgba(245,158,11,0.15);}
  body.dark tr.hl td{background:rgba(245,158,11,0.24);}

  /* 全局隐藏滚动条（用户要求）：溢出仍可手势滚动，只是不画那条 */
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html, body { scrollbar-width: none; -ms-overflow-style: none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var app=document.getElementById('app');

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function report(){
    try{
      var h=Math.max(app.scrollHeight, document.body.scrollHeight);
      if(window.arkHost&&window.arkHost.postHeight){window.arkHost.postHeight(h);}
    }catch(e){}
  }

  /**
   * 宿主注入入口（与其它模板同一约定）：p = {src, dark, fit, vw, html}
   * src = 代码原文；**html = 宿主排好版的逐行高亮结果**（代码块放大时由
   * ArkTS 用正文卡片同一套分词与配色生成，行与行用 \n 分隔，已转义）。
   * ⚠️ 有 html 就必须用它：模板里不再另写一份高亮器，否则浮层与卡片
   * 两处颜色会走偏（同一份代码两种配色的 bug 就是这么来的）。
   * 放大浮层里展示**带行号的等宽代码**，可缩放 / 旋转 / 滚动
   * （缩放与旋转由放大浮层统一提供，这里只负责排版）。
   */
  window.renderPayload=function(p){
    try{
      document.body.className=(p&&p.dark)?'dark':'';
      var lines=String((p&&p.src)||'').replace(/\r\n?/g,'\n').split('\n');
      var rich=(p&&typeof p.html==='string'&&p.html.length>0)?p.html.split('\n'):null;
      // 宿主传来的指定高亮行（1 起，CSV）。⚠️ 只认字符串里的数字，缺省 = 一行都不亮。
      var hlSet={};
      String((p&&p.hl)||'').split(',').forEach(function(x){
        var v=parseInt(x,10);
        if(!isNaN(v)){hlSet[v]=true;}
      });
      var rows=[];
      for(var k=0;k<lines.length;k++){
        var cell=rich?(rich[k]||''):esc(lines[k]);
        rows.push('<tr'+(hlSet[k+1]?' class="hl"':'')+'><td class="ln">'+(k+1)+'</td><td class="lc">'+(cell||'&nbsp;')+'</td></tr>');
      }
      app.innerHTML='<table>'+rows.join('')+'</table>';
      report();
      setTimeout(report,80);
      setTimeout(report,260);
    }catch(err){
      app.innerHTML='<pre>'+(err&&err.message?err.message:err)+'</pre>';
      report();
    }
  };

  window.addEventListener('load',report);
})();
</script>
</body></html>
