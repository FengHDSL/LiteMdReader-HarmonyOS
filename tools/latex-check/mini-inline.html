<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="katex.min.css"/>
<style>
body{font-family:sans-serif;padding:12px;background:#fff}
.item{margin:8px 0;border-bottom:1px dashed #eee;padding:6px 0}
.cap{font-size:11px;color:#999}
.box{display:inline-block}
</style></head>
<body>
<div id="list"></div>
<script src="katex.min.js"></script>
<script>
const CASES = [
  { n: '矩阵行内 (pmatrix)', s: '\\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}' },
  { n: 'array 行内（含 \\hline）', s: '\\begin{array}{c|c} a & b \\\\ \\hline c & d \\end{array}' },
  { n: '求和行内', s: '\\sum_{n=1}^{\\infty} \\frac{1}{n^2}' },
  { n: 'Vmatrix 行内', s: '\\begin{Vmatrix} a & b \\\\ c & d \\end{Vmatrix}' },
  { n: 'aligned 行内', s: '\\begin{aligned} (a+b)^2 &= a^2+2ab+b^2 \\\\ (a-b)^2 &= a^2-2ab+b^2 \\end{aligned}' },
];
const errors = [];
const list = document.getElementById('list');
CASES.forEach(function(c, i){
  const item = document.createElement('div'); item.className='item';
  const cap = document.createElement('div'); cap.className='cap'; cap.textContent=(i+1)+'. '+c.n;
  const box = document.createElement('span'); box.className='box'; box.id='b'+i;
  item.appendChild(cap); item.appendChild(box); list.appendChild(item);
  katex.render(c.s, box, {displayMode:false, throwOnError:false, output:'html'});
  const err = box.querySelector('.katex-error');
  if (err) errors.push({i:i, name:c.n, msg:(err.getAttribute('title')||'').slice(0,120)});
});
const res=document.createElement('div'); res.id='mini-result';
res.setAttribute('data-json', JSON.stringify(errors));
document.body.appendChild(res);
</script>
</body></html>
