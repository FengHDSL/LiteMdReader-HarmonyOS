<script>
const f = document.getElementById('f');
const results = [];
const received = [];
f.addEventListener('load', function () {
  f.contentWindow.arkHost = {
    postReady: function () { window.__readyAt = true; },
    postPng: function (json) { received.push(json); }
  };
  const t0 = Date.now();
  const timer = setInterval(function () {
    if (f.contentWindow.__mjReady) { clearInterval(timer); start(); }
    else if (Date.now() - t0 > 30000) { clearInterval(timer); failAll('not ready'); }
  }, 200);
});
const CASES = [
  { key: 'k1', tex: '\\alpha, \\beta, \\gamma, x^2, \\frac{a}{b}', size: 18 },
  { key: 'k2', tex: '\\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}', size: 18 },
  { key: 'k3', tex: '\\text{如果 } a = b \\text{，则 } c = d', size: 18 },
  { key: 'k4', tex: '\\color{red}{红色} + \\sum_{n=1}^{\\infty} \\frac{1}{n^2}', size: 22 },
  { key: 'k5', tex: '\\newcommand{\\R}{\\mathbb{R}}\\forall x \\in \\R, \\; x^2 \\ge 0', size: 18 },
  { key: 'k6', tex: '\\sum_{n=0}^{\\infty} \\frac{1}{n!}', size: 18, ink: '#ECEFF4' },
  { key: 'k7', tex: '\\sum_{n=0}^{\\infty} \\frac{1}{n!}', size: 18, ink: '#1A1A1A' },
];
function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
function start() {
  let i = 0;
  (function next() {
    if (i >= CASES.length) { done(); return; }
    const c = CASES[i]; i++;
    const before = received.length;
    f.contentWindow.tex2png(c.key, b64utf8(c.tex), 0, c.size, c.ink || '#1A1A1A');
    const t0 = Date.now();
    const timer = setInterval(function () {
      if (received.length > before) {
        clearInterval(timer);
        const msg = JSON.parse(received[received.length - 1]);
        results.push({ key: c.key, ok: msg.ok, w: msg.w, h: msg.h, err: msg.err || '', len: (msg.png || '').length });
        if (msg.ok) {
          const img = document.createElement('img');
          img.src = msg.png;
          img.style.height = Math.min(60, msg.h) + 'px';
          img.style.background = '#22222A';
          document.getElementById('shots').appendChild(img);
        }
        setTimeout(next, 50);
      } else if (Date.now() - t0 > 12000) {
        clearInterval(timer);
        results.push({ key: c.key, ok: false, err: 'timeout waiting postPng' });
        next();
      }
    }, 60);
  })();
}
function failAll(err) {
  const res = document.createElement('div');
  res.id = 'mjf-result';
  res.setAttribute('data-json', JSON.stringify([{ ok: false, err: err }]));
  document.body.appendChild(res);
}
function done() {
  const res = document.createElement('div');
  res.id = 'mjf-result';
  res.setAttribute('data-json', JSON.stringify(results));
  document.body.appendChild(res);
  document.title = 'DONE ' + results.filter(function (r) { return r.ok; }).length + '/' + results.length;
}
</script>
