<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.05,maximum-scale=10,user-scalable=yes">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;}
  #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  img{max-width:100%;max-height:100%;object-fit:contain;}
  .err{color:#8b93a1;font-size:14px;padding:24px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<script>
  function report(){
    try{
      var app=document.getElementById('app');
      var h=Math.max(app?app.scrollHeight:0, document.body.scrollHeight,
                     document.documentElement.scrollHeight, document.documentElement.offsetHeight);
      if(window.arkHost&&window.arkHost.postHeight){window.arkHost.postHeight(h);}
    }catch(e){}
  }
  // 图片放大页：source 由 renderPayload 传入（file:// 绝对路径）
  window.__render=function(src){
    var app=document.getElementById('app');
    app.innerHTML='';
    var im=document.createElement('img');
    im.onload=function(){ report(); };
    im.onerror=function(){
      try{ console.error('image load failed: ' + src); }catch(e){}
      app.innerHTML='<div class="err">图片加载失败</div>'; report();
    };
    im.src=src;
    app.appendChild(im);
  };
  window.refit=function(){ try{ report(); }catch(e){} };
  window.renderPayload=function(json){
    try{
      var o=(typeof json==='string')?JSON.parse(json):json;
      if(o.dark){document.body.classList.add('dark');}
      window.__render(o.src);
      setTimeout(report,80); setTimeout(report,320);
    }catch(e){ report(); }
  };
  window.addEventListener('load',report);
</script>
</body></html>
