<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/render/graphviz.html?v=9" style="width:480px;height:220px"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  const f = this;
  f.contentWindow.renderPayload(JSON.stringify({ src: 'digraph { rankdir=LR; a -> b; b -> c; }', dark: false }));
  setTimeout(function () {
    let ok = false; let extra = '';
    try {
      const doc = f.contentDocument;
      ok = doc.querySelector('#app svg') !== null;
      const err = doc.querySelector('#app .err');
      if (err) { extra = (err.textContent || '').slice(0, 120); ok = false; }
    } catch (e) { extra = String(e); }
    const d = document.createElement('div'); d.id = 'gv3';
    d.setAttribute('data-json', JSON.stringify({ ok: ok, err: extra }));
    document.body.appendChild(d);
  }, 4000);
});
</script>
<div id="gv3" data-json="{&quot;ok&quot;:true,&quot;err&quot;:&quot;&quot;}"></div></body></html>
