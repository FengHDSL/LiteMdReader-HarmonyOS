<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Editor</title>
<script src="marked.min.js"></script>
<script src="turndown.js"></script>
<style>
:root{
  --bg:#11161d; --bg2:#161D26; --line:#2A3441; --tx:#E6ECF2; --tx2:#8FA1B3;
  --accent:#7FA8D9; --gold:#D4BA86; --code:#1B2330;
  /* 按压反馈的 RGB 三元组：浅色主题由 setTheme 置为 0,0,0（深底白闪/浅底黑闪） */
  --press:255,255,255;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:16px;line-height:1.75;overflow:hidden;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none}
#bar{display:flex;align-items:center;gap:2px;padding:8px 10px;background:var(--bg2);
  border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.bt{min-width:34px;height:32px;border-radius:7px;border:none;background:transparent;color:var(--tx);
  font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;padding:0 6px}
.bt:active{background:rgba(var(--press),.12);color:var(--gold)}
.sep{width:1px;height:20px;background:var(--line);margin:0 5px;flex-shrink:0}
#editor{flex:1;overflow-y:auto;padding:18px 20px 120px;user-select:text}
#editor.editable *{user-select:text}
.block{margin-bottom:14px;border-radius:8px;transition:background .15s}
.block.editing{background:rgba(127,168,217,.07);box-shadow:inset 0 0 0 1px rgba(127,168,217,.25)}
.block.plain{cursor:text}
.block h1,.block h2,.block h3{font-family:var(--serif,serif);margin:6px 0}
.block h1{font-size:26px}.block h2{font-size:22px}.block h3{font-size:19px}
.block p{margin:6px 0}
.block ul,.block ol{padding-left:26px;margin:6px 0}
.block blockquote{border-left:3px solid var(--gold);padding:6px 14px;color:var(--tx2);margin:8px 0}
.block pre{background:var(--code);border-radius:10px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.6}
.block code{font-family:'HarmonyOS Sans Code',monospace}
.block table{border-collapse:collapse;width:100%;font-size:14px}
.block th,.block td{border:1px solid var(--line);padding:7px 10px}
.block th{background:var(--code)}
.block img{max-width:100%;border-radius:8px}
.block hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.block[contenteditable="true"]{outline:none;min-height:1.4em}
.block[contenteditable="true"]:focus{box-shadow:inset 0 0 0 1px rgba(127,168,217,.35)}
textarea.src{width:100%;background:var(--code);color:var(--tx);border:1px solid rgba(127,168,217,.35);
  border-radius:8px;font-family:'HarmonyOS Sans Code',monospace;font-size:14.5px;line-height:1.7;
  padding:12px;resize:none;outline:none;overflow:hidden;user-select:text}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(40,52,68,.95);
  color:var(--tx);padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="bar">
  <button class="bt" data-a="undo" title="撤销">↶</button>
  <button class="bt" data-a="redo" title="重做">↷</button>
  <span class="sep"></span>
  <button class="bt" data-a="h1">H1</button>
  <button class="bt" data-a="h2">H2</button>
  <button class="bt" data-a="h3">H3</button>
  <span class="sep"></span>
  <button class="bt" data-a="bold" style="font-weight:800">B</button>
  <button class="bt" data-a="italic" style="font-style:italic;font-family:Georgia,serif">I</button>
  <button class="bt" data-a="strike" style="text-decoration:line-through">S</button>
  <span class="sep"></span>
  <button class="bt" data-a="quote" title="引用">"</button>
  <button class="bt" data-a="ol" title="有序列表">☰</button>
  <button class="bt" data-a="ul" title="无序列表">≔</button>
  <button class="bt" data-a="task" title="任务">☑</button>
  <span class="sep"></span>
  <button class="bt" data-a="hr" title="分隔线">—</button>
  <button class="bt" data-a="code" title="代码块">&lt;/&gt;</button>
  <button class="bt" data-a="table" title="表格">▦</button>
  <button class="bt" data-a="link" title="链接">⛓</button>
</div>
<div id="editor"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
