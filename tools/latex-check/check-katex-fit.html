<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>katex-fit-check</title></head>
<body>
<pre id="out">pending</pre>
<iframe id="f" style="width:360px;height:500px;border:1px solid #ccc"></iframe>
<script>
// 放大窗口布局修复验证：
//   fit=true（放大浮层）→ #app 应为 overflow:auto + .katex-display 左对齐
//     （超宽公式 scrollWidth 远大于 clientWidth 且可平移看全；
//      超高公式 scrollHeight 覆盖全部行——此前 flex 居中顶部溢出不可达）；
//   fit=false（阅读页卡片/快照）→ 维持 overflow:hidden + 居中（回归保护）。
const LONG = Array.from({length: 90}, function(_, i){ return 'x_{'; }).map(function(_, i){ return 'x_{'+(i+1)+'}'; }).join('+');
const TALL = '\\begin{aligned}' + Array.from({length: 30}, function(_, i){ return 'y_{l'+(i+1)+'}&=z_{'+(i+1)+'}+c'; }).join('\\\\') + '\\end{aligned}';
function $(id){ return document.getElementById(id); }
function cssColor(appHex){
  const s = appHex.trim();
  if (s.length !== 9 || s.charAt(0) !== '#') { return s; }
  const a = parseInt(s.substring(1, 3), 16), r = parseInt(s.substring(3, 5), 16),
        g = parseInt(s.substring(5, 7), 16), b = parseInt(s.substring(7, 9), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + Math.round(a / 255 * 100) / 100 + ')';
}
function describe(w){
  const d = w.document, app = d.getElementById('app');
  const kd = d.querySelector('.katex-display');
  const cs = w.getComputedStyle(app);
  // ⚠️ bg 转换断言：#AARRGGBB 进 Web 必须转 rgba（CSS 8 位 hex 是 #RRGGBBAA，
  // '#FF10131A' 直塞会被解析成 10% 红罩 → 卡片发红，用户实测截图实锤）
  return JSON.stringify({
    overflowX: cs.overflowX,
    kdAlign: kd ? w.getComputedStyle(kd).textAlign : '(none)',
    bodyBg: w.getComputedStyle(d.body).backgroundColor,
    scrollW: app.scrollWidth, clientW: app.clientWidth,
    scrollH: app.scrollHeight, clientH: app.clientHeight
  });
}
(async function(){
  const lines = [];
  window.onerror = function(m){ lines.push('onerror: ' + m); $('out').textContent = lines.join('\n'); };
  try {
    const f = $('f');
    const loaded = new Promise(function(res, rej){ f.onload = res; f.onerror = function(){ rej(new Error('iframe onerror')); }; });
    f.src = '/entry/src/main/resources/rawfile/render/katex.html';
    await loaded;
    lines.push('iframe loaded');
    const w = f.contentWindow;
    lines.push('has renderPayload: ' + (typeof w.renderPayload));
    $('out').textContent = lines.join('\n');
    w.renderPayload({ src: LONG, dark: false, fit: true, inline: false, bg: cssColor('#FF10131A') });
    await new Promise(function(r){ setTimeout(r, 700); });
    lines.push('fit-wide ' + describe(w));
    w.renderPayload({ src: TALL, dark: false, fit: true, inline: false, bg: cssColor('#FF10131A') });
    await new Promise(function(r){ setTimeout(r, 700); });
    lines.push('fit-tall ' + describe(w));
    w.renderPayload({ src: LONG, dark: false, fit: false, inline: false, bg: cssColor('#FF10131A') });
    await new Promise(function(r){ setTimeout(r, 700); });
    lines.push('card-wide ' + describe(w));
  } catch (e) {
    lines.push('FAIL: ' + (e && e.message ? e.message : String(e)));
  }
  $('out').textContent = lines.join('\n');
  document.title = 'DONE';
})();
</script>
</body></html>
